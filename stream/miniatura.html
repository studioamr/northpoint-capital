<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NORTHPOINT · Miniatura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   NORTHPOINT · MINIATURA DE VOD (1280×720)

   Editable por URL, para no tocar código después de cada sesión:
     ?t=NO TRADE.&s=Y FUE UN BUEN DÍA&n=03&e=ASIA SESSION

     t = la línea gigante (lo que se lee a tamaño de sello)
     s = la línea de abajo, el giro
     n = el número grande de la esquina (opcional; vacío lo apaga)
     e = la etiqueta de sesión

   Regla de miniatura: SE LEE A 120px DE ANCHO o no sirve. Por eso
   máximo 3 palabras arriba, contraste brutal, y cero adornos que
   compitan con el texto.
   ═══════════════════════════════════════════════════════════════ */
:root{ --oro:#C9A84C; --tinta:#F4F4F4; }
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#080808;position:relative;
  font-family:'Inter',system-ui,sans-serif;color:var(--tinta);
  print-color-adjust:exact;-webkit-print-color-adjust:exact}
#estrellas{position:absolute;inset:0}
/* el barrido diagonal de luz: le da profundidad sin robar lectura */
.halo{position:absolute;inset:0;
  background:radial-gradient(1100px 620px at 76% 18%, rgba(201,168,76,.16), transparent 62%)}
.marco{position:absolute;inset:26px;border:1px solid rgba(255,255,255,.12)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 78px}
.marca{position:absolute;top:56px;left:78px;font-size:23px;font-weight:700;letter-spacing:.2em}
.marca em{font-style:normal;color:var(--oro)}
.ses{position:absolute;top:60px;right:78px;font-family:'IBM Plex Mono',monospace;
  font-size:14px;letter-spacing:.3em;color:rgba(244,244,244,.55)}
.t{font-size:132px;font-weight:900;letter-spacing:-.03em;line-height:.94;
  text-transform:uppercase;text-shadow:0 6px 40px rgba(0,0,0,.85)}
.t.corto{font-size:158px}
.raya{width:96px;height:5px;background:var(--oro);margin:30px 0 26px;border-radius:99px}
.s{font-size:38px;font-weight:600;letter-spacing:.01em;color:rgba(244,244,244,.9);
  max-width:820px;line-height:1.2}
.n{position:absolute;right:66px;bottom:40px;font-size:230px;font-weight:900;
  color:rgba(201,168,76,.20);letter-spacing:-.06em;line-height:.8}
.pie{position:absolute;left:78px;bottom:56px;font-family:'IBM Plex Mono',monospace;
  font-size:15px;letter-spacing:.26em;color:rgba(244,244,244,.42)}
</style>
</head>
<body>
<canvas id="estrellas" width="1280" height="720"></canvas>
<div class="halo"></div>
<div class="marco"></div>
<div class="marca">NORTHPOINT<em> ·</em></div>
<div class="ses" id="ses">ASIA SESSION</div>
<div class="n" id="n"></div>
<div class="wrap">
  <div class="t" id="t">NO TRADE.</div>
  <div class="raya"></div>
  <div class="s" id="s">Y FUE UN BUEN DÍA</div>
</div>
<div class="pie">LIVE FUTURES DESK · MON–FRI</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var t = p.get('t'), s = p.get('s'), n = p.get('n'), e = p.get('e');
  var elT = document.getElementById('t');
  if (t) elT.textContent = t;
  if (s) document.getElementById('s').textContent = s;
  if (e) document.getElementById('ses').textContent = e;
  if (n !== null) document.getElementById('n').textContent = n;
  /* una sola palabra corta puede crecer más sin romper el ancho */
  if (elT.textContent.replace(/[^A-Za-zÁÉÍÓÚÑ0-9]/g,'').length <= 9) elT.classList.add('corto');
  var cx = document.getElementById('estrellas').getContext('2d');
  for (var i = 0; i < 150; i++){
    cx.fillStyle = 'rgba(255,255,255,' + (.06 + (i % 5) * .05).toFixed(2) + ')';
    cx.fillRect((i * 173.2) % 1280, (i * 97.3) % 720, 2, 2);
  }
})();
</script>
</body>
</html>
