<style>
*{margin:0;padding:0}
body{width:512px;height:512px;background:#080808;display:flex;
     align-items:center;justify-content:center;overflow:hidden}
</style>

<!-- La aguja que apunta al norte. Se eligió esto y no una «N» porque Discord ya
     pone la inicial por defecto: un icono que repite la letra no se distingue
     del servidor sin icono. Y a 48 px —el tamaño real en la barra lateral— una
     silueta de leopardo se vuelve una mancha; una aguja de dos triángulos
     sobrevive el escalado, que es la única prueba que importa. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- el anillo -->
  <circle cx="256" cy="256" r="196" fill="none"
          stroke="#F4F4F4" stroke-opacity=".16" stroke-width="6"/>
  <!-- las cuatro marcas cardinales -->
  <g stroke="#F4F4F4" stroke-opacity=".28" stroke-width="6" stroke-linecap="square">
    <line x1="256" y1="42"  x2="256" y2="72"/>
    <line x1="256" y1="440" x2="256" y2="470"/>
    <line x1="42"  y1="256" x2="72"  y2="256"/>
    <line x1="440" y1="256" x2="470" y2="256"/>
  </g>
  <!-- la aguja: el norte en hueso, el sur apagado.
       El vértice sube hasta y=86 para que la punta toque el aire del anillo. -->
  <path d="M256 86 L318 300 L256 262 Z" fill="#F4F4F4"/>
  <path d="M256 86 L194 300 L256 262 Z" fill="#C9CAC6"/>
  <path d="M256 426 L318 300 L256 262 Z" fill="#4A4A46"/>
  <path d="M256 426 L194 300 L256 262 Z" fill="#2C2C29"/>
  <!-- el punto de oro en el eje: el único acento de la marca -->
  <circle cx="256" cy="262" r="13" fill="#C8A24A"/>
</svg>
