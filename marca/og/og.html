<!doctype html><meta charset="utf-8">
<!--
  PLANTILLA DE LA TARJETA og.png · 1200×630
  Se regenera con  marca/og/generar.sh  y el resultado va a  /og.png  (raíz).

  ES MONOCROMA A PROPÓSITO. La portada no tiene ni un color de acento
  (--accent:#FFFFFF en index.html); el oro vive sólo en family-office.html y
  perfil.html. Una tarjeta dorada prometería una portada que no existe.

  LA ÚNICA LÍNEA QUE SE LEE EN WHATSAPP ES EL TITULAR. La vista previa se
  muestra a ~250 px de ancho: lo de 16 px aquí son 3 px en el teléfono. Por eso
  hay titular grande, UNA subtítulo y nada más — no una retícula de columnas.
-->
<style>
@page{margin:0}
html,body{margin:0;width:1200px;height:630px;background:#080808;overflow:hidden}
body{font-family:"Helvetica Neue",Inter,Arial,sans-serif;color:#F4F4F4;
  -webkit-font-smoothing:antialiased;position:relative}
/* la misma retícula tenue de la tarjeta anterior */
.rej{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:60px 60px}
.marco{position:absolute;inset:0;padding:74px 84px;display:flex;
  flex-direction:column;justify-content:space-between}
.micro{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:17px;
  letter-spacing:.34em;text-transform:uppercase;color:#7C7C7C}
h1{font-size:96px;line-height:.98;letter-spacing:-.035em;font-weight:700;
  margin:0;max-width:19ch}
.sub{margin-top:26px;font-size:27px;line-height:1.42;color:#A6A6A6;
  font-weight:300;max-width:40ch}
.pie{border-top:1px solid rgba(255,255,255,.13);padding-top:22px;
  display:flex;align-items:flex-end;justify-content:space-between}
.pie b{display:block;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  font-size:21px;letter-spacing:.28em;font-weight:600;color:#F4F4F4}
.pie i{display:block;margin-top:7px;font-style:normal;
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:14px;
  letter-spacing:.26em;text-transform:uppercase;color:#7C7C7C}
.pie span{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:18px;
  letter-spacing:.16em;color:#A6A6A6}
</style>
<div class="rej"></div>
<div class="marco">
  <p class="micro">México</p>
  <div>
    <h1>Academia y family office.</h1>
    <p class="sub">Enseñamos a operar futuros. Y estructuramos el patrimonio
      de las familias que ya lo construyeron.</p>
  </div>
  <div class="pie">
    <div><b>NORTHPOINT</b><i>Academia · Family Office</i></div>
    <span>northpointcapital.io</span>
  </div>
</div>
