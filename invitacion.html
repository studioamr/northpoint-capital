<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORTHPOINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   NORTHPOINT · INVITACIÓN
   Dos hojas y nada más. La uno es el logo; la dos, dos puertas.

   Se imprime a SANGRE (margin:0 en @page) porque un negro con marco
   blanco alrededor no se ve como una invitación, se ve como un
   documento impreso. Por eso también print-color-adjust:exact — sin
   eso el navegador tira el fondo para ahorrar tinta y salen dos
   hojas blancas.

   No explica nada a propósito. Lo que hace la mesa se cuenta adentro.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#080808;
  --txt:#F4F4F4;
  --dim:#A6A6A6;
  --faint:#6E6E6E;
  --line:rgba(255,255,255,.14);
  --line-soft:rgba(255,255,255,.07);
  --sans:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;
  print-color-adjust:exact;-webkit-print-color-adjust:exact}

.hoja{
  width:210mm;height:297mm;margin:0 auto;background:var(--bg);position:relative;
  display:flex;flex-direction:column;padding:26mm 24mm;overflow:hidden;
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
}
.hoja + .hoja{margin-top:16px}

/* ── HOJA 1 · el logo y nada más ── */
.centro{margin:auto;text-align:center}
.marca{font-size:58px;letter-spacing:.14em;font-weight:600;line-height:1}
.bajo{font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--faint);
  margin-top:20px}
.raya{width:44px;height:1px;background:var(--line);margin:44px auto 0}

.pie-h{position:absolute;left:24mm;right:24mm;bottom:20mm;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--faint)}

/* ── HOJA 2 · las puertas ── */
.puertas{margin:auto 0}
.p{display:flex;align-items:baseline;gap:16px;padding:9mm 0;
  border-bottom:1px solid var(--line-soft)}
.p:first-child{border-top:1px solid var(--line-soft)}
.p .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);
  min-width:26px}
.p .cuerpo{flex:1}
.p .t{font-size:26px;letter-spacing:-.01em;font-weight:600;line-height:1.1}
.p .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--dim);
  margin-top:7px;word-break:break-all}
.p .d.sin{color:var(--faint)}
a{color:inherit;text-decoration:none}

@page{size:A4;margin:0}
@media print{
  .hoja{margin:0;page-break-after:always;break-after:page}
  .hoja:last-child{page-break-after:auto;break-after:auto}
  .hoja + .hoja{margin-top:0}
}
@media (max-width:760px){
  .hoja{width:100%;height:auto;min-height:100vh;padding:44px 26px}
  .marca{font-size:34px;letter-spacing:.1em}
  .p .t{font-size:20px}
  .pie-h{left:26px;right:26px;bottom:26px}
}
</style>
</head>
<body>

<!-- ══════════ HOJA 1 ══════════ -->
<div class="hoja">
  <div class="centro">
    <div class="marca">NORTHPOINT</div>
    <div class="bajo">CAPITAL MANAGEMENT</div>
    <div class="raya"></div>
  </div>
  <div class="pie-h">
    <span>INVITACIÓN</span>
    <span>MMXXVI</span>
  </div>
</div>

<!-- ══════════ HOJA 2 ══════════ -->
<div class="hoja">
  <div class="puertas">
    <div class="p">
      <span class="n">01</span>
      <div class="cuerpo">
        <div class="t">La firma</div>
        <a class="d" href="https://northpointcapital.io/">northpointcapital.io</a>
      </div>
    </div>

    <div class="p">
      <span class="n">02</span>
      <div class="cuerpo">
        <div class="t">El Discord</div>
        <a class="d" href="https://discord.gg/eEp8Tv9tr">discord.gg/eEp8Tv9tr</a>
      </div>
    </div>
  </div>

  <div class="pie-h">
    <span>NORTHPOINT</span>
  </div>
</div>

</body>
</html>
